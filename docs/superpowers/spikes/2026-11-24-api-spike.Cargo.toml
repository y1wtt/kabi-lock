[package]
name = "spike"
version = "0.1.0"
edition = "2024"

[dependencies]
calloop = "0.14.5"
calloop-wayland-source = "0.4.1"
chrono = "0.4.45"
egui = "0.37"
egui_glow = "0.37"
env_logger = "0.11.12"
glow = "0.17"
khronos-egl = { version = "6.0.0", features = ["static"] }
log = "0.4.35"
pam-client = "0.5.0"
smithay-client-toolkit = "0.21.1"
swayipc = "4.0.0"
wayland-client = "0.31.15"
wayland-egl = "0.32.11"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
zbus = "5"
