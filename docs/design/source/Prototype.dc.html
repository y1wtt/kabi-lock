<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>kabi-lock 試し打ち</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;family=Noto+Sans+JP:wght@400&amp;display=swap">
<style>
body{margin:0}
a{color:#d6dae3}a:hover{color:#ffffff}
/* Rises from the bottom with a quick bloom, then fades out */
@keyframes kabiFade{0%{opacity:0;transform:scaleY(0.35)}12%{opacity:1;transform:scaleY(1.06)}22%{transform:scaleY(1)}100%{opacity:0;transform:scaleY(1)}}
.kabi-bar{position:absolute;top:0;height:72px;transform-origin:50% 100%;-webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 100%);mask-image:linear-gradient(to bottom,transparent 0%,#000 100%);animation-name:kabiFade;animation-timing-function:ease-out;animation-fill-mode:forwards}
.kabi-lockwrap{opacity:0;transition:opacity 180ms ease}
.kabi-lockwrap.kabi-shown{opacity:1}
.kabi-input{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;border:0;padding:0;margin:0;cursor:default}
.kabi-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.kabi-bg{filter:blur(44px);transition:filter 700ms ease}
.kabi-bg.kabi-clear{filter:blur(0)}
.kabi-vig{transition:opacity 700ms ease}
.kabi-vig.kabi-clear{opacity:0}
.kabi-content{transition:opacity 500ms ease}
.kabi-content.kabi-clear{opacity:0}
@keyframes kabiShake{0%,100%{transform:translateX(0)}12%{transform:translateX(-10px)}28%{transform:translateX(9px)}44%{transform:translateX(-7px)}60%{transform:translateX(5px)}76%{transform:translateX(-3px)}88%{transform:translateX(1px)}}
.kabi-shake{animation:kabiShake 450ms ease-in-out}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #0d0f13; font-family: 'Inter', 'Noto Sans JP', sans-serif; color: #f2f4f8">
  <div aria-hidden="true" class="kabi-bg {{clearClass}}" style="position: absolute; left: -80px; top: -80px; right: -80px; bottom: -80px">
    <div style="position: absolute; left: 0; top: 80px; width: 2080px; height: 44px; background: #1c2029"></div>
    <div style="position: absolute; left: 200px; top: 180px; width: 940px; height: 640px; border-radius: 14px; background: #283244"></div>
    <div style="position: absolute; left: 260px; top: 240px; width: 520px; height: 24px; border-radius: 6px; background: #4a5a78"></div>
    <div style="position: absolute; left: 260px; top: 300px; width: 760px; height: 360px; border-radius: 8px; background: #1d2533"></div>
    <div style="position: absolute; left: 1200px; top: 220px; width: 760px; height: 560px; border-radius: 14px; background: #1f3836"></div>
    <div style="position: absolute; left: 1260px; top: 300px; width: 420px; height: 180px; border-radius: 8px; background: #3a6460"></div>
    <div style="position: absolute; left: 280px; top: 880px; width: 1600px; height: 220px; border-radius: 14px; background: #33291f"></div>
  </div>
  <div aria-hidden="true" class="kabi-vig {{clearClass}}" style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 35%, rgba(0,0,0,0.6) 100%)"></div>
  <div class="kabi-content {{clearClass}}" style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; box-sizing: border-box; padding-top: 130px; gap: 374px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 14px">
      <div class="kabi-lockwrap {{lockShown}}" style="width: 60px; height: 52px; margin-bottom: 18px">
      <div class="{{lockClass}}" style="width: 60px; height: 52px">
        <svg viewBox="0 0 64 56" width="60" height="52" role="img" aria-label="{{lockLabel}}">
          <path d="{{shackleD}}" transform="translate(0 {{shackleY}})" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"></path>
          <rect x="14" y="24" width="36" height="28" rx="6" fill="#ffffff"></rect>
        </svg>
      </div>
      </div>
      <div style="font-size: 104px; font-weight: 500; line-height: 1; letter-spacing: -2px; font-variant-numeric: tabular-nums; color: rgba(255,255,255,0.94)">{{time}}</div>
      <div style="font-size: 26px; font-weight: 400; letter-spacing: 1px; color: rgba(255,255,255,0.74)">{{date}}</div>
    </div>
    <div aria-hidden="true" style="position: relative; width: 768px; height: 72px">
      <sc-for list="{{bars}}" as="bar" hint-placeholder-count="0">
        <div class="kabi-bar" style="left: {{bar.left}}px; width: {{bar.w}}px; background: linear-gradient(90deg, {{bar.edge}} 0%, {{bar.mid}} 22%, {{bar.mid}} 78%, {{bar.edge}} 100%); animation-duration: {{bar.dur}}ms"></div>
      </sc-for>
    </div>
  </div>
  <label for="kabi-pass" class="kabi-sr">パスワード</label>
  <input id="kabi-pass" class="kabi-input" type="password" autocomplete="off" autoFocus="{{ true }}" value="{{value}}" onChange="{{onChange}}" onKeyDown="{{onKeyDown}}">
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"fadeMs":{"editor":"range","default":900,"min":200,"max":3000,"step":50,"unit":"ms","section":"入力フィードバック"},"barColor":{"editor":"color","default":"#ffffff","options":["#ffffff","#9ec5ff","#ffb37a"],"section":"入力フィードバック"},"barWidth":{"editor":"range","default":32,"min":16,"max":200,"step":4,"unit":"px","section":"入力フィードバック"},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
// phase: idle | unlocking | unlocked | failed
this.state = { bars: [], value: '', now: new Date(), phase: 'idle' };
this.nextId = 1;
this.timers = [];
}
componentDidMount() {
this.clock = setInterval(() => this.setState({ now: new Date() }), 1000);
}
componentWillUnmount() {
clearInterval(this.clock);
this.timers.forEach((t) => clearTimeout(t));
cancelAnimationFrame(this.raf);
}
// Shackle shape `ms` after unlocking starts. It pops up, then swivels around
// its long (right) leg like a round rod: the short leg's x follows cos(angle)
// while the stroke keeps its width, so it never flattens like paper.
shackleAt(ms) {
let y = 0;
if (ms > 0) {
const p = Math.min(1, ms / 260);
y = p < 0.6 ? -11 * (p / 0.6) : -11 + 2 * ((p - 0.6) / 0.4);
}
let ang = 0;
if (ms > 260) {
const q = Math.min(1, (ms - 260) / 540);
const e = q < 0.5 ? 2 * q * q : 1 - Math.pow(-2 * q + 2, 2) / 2;
ang = Math.PI * e;
}
const f = (v) => v.toFixed(2);
const x1 = 42 - 20 * Math.cos(ang);
const a = (42 - x1) / 2;
const cx = (x1 + 42) / 2;
const k = 0.5523;
const d = 'M' + f(x1) + ' 26 V18 C' + f(x1) + ' ' + f(18 - 10 * k) + ' ' + f(cx - a * k) + ' 8 ' + f(cx) + ' 8 C' + f(cx + a * k) + ' 8 42 ' + f(18 - 10 * k) + ' 42 18 V40';
return { d, y: f(y) };
}
playUnlock() {
cancelAnimationFrame(this.raf);
const t0 = performance.now();
const step = () => {
const ms = performance.now() - t0;
this.setState({ unlockMs: ms });
if (ms < 820) {
this.raf = requestAnimationFrame(step);
}
};
this.raf = requestAnimationFrame(step);
}
later(fn, ms) {
this.timers.push(setTimeout(fn, ms));
}
fadeMs() {
return this.props.fadeMs ?? 900;
}
lanes() {
// Fixed lanes across the band; a new bar takes a random free lane so bars
// never overlap while still visible
const w = this.props.barWidth ?? 32;
const pitch = w + 16;
const band = 768;
const n = Math.max(1, Math.floor((band + 16) / pitch));
const offset = Math.round((band - (n * pitch - 16)) / 2);
return { w, pitch, n, offset };
}
spawnBar() {
// Faded bars stay in the list (at opacity 0) until the next submit clears
// it, so existing elements are never reused for a different bar mid-fade.
const { n } = this.lanes();
const now = Date.now();
const live = this.state.bars.filter((b) => now - b.t < this.fadeMs());
const busy = new Set(live.map((b) => b.lane));
const free = [];
for (let i = 0; i < n; i++) {
if (!busy.has(i)) {
free.push(i);
}
}
// Every lane busy (very fast typing): reuse the lane of the oldest live bar
const lane = free.length ? free[Math.floor(Math.random() * free.length)] : live[0].lane;
const id = this.nextId++;
this.setState((s) => ({ bars: s.bars.concat([{ id, lane, t: now }]) }));
}
submit() {
if (this.state.phase !== 'idle') {
return;
}
if (this.state.value === 'kabi') {
this.setState({ phase: 'unlocking', bars: [] });
this.playUnlock();
this.later(() => this.setState({ phase: 'unlocked' }), 900);
this.later(() => this.setState({ phase: 'idle', value: '', unlockMs: 0 }), 3000);
} else {
// The lock shows only after Enter: shake, stay a moment, then hide again
this.setState({ phase: 'failed', value: '', bars: [] });
this.later(() => this.setState({ phase: 'idle' }), 1200);
}
}
renderVals() {
const color = this.props.barColor ?? '#ffffff';
const edge = 'color-mix(in srgb, ' + color + ' 85%, transparent)';
const mid = 'color-mix(in srgb, ' + color + ' 38%, transparent)';
const { w, pitch, offset } = this.lanes();
const dur = this.fadeMs();
const now = this.state.now;
const hh = String(now.getHours()).padStart(2, '0');
const mm = String(now.getMinutes()).padStart(2, '0');
const phase = this.state.phase;
const shackle = this.shackleAt(this.state.unlockMs || 0);
return {
shackleD: shackle.d,
shackleY: shackle.y,
time: hh + ':' + mm,
date: String(now.getMonth() + 1).padStart(2, '0') + '/' + String(now.getDate()).padStart(2, '0'),
value: this.state.value,
bars: this.state.bars.map((b) => ({ left: offset + b.lane * pitch, w, color, edge, mid, dur })),
lockClass: phase === 'failed' ? 'kabi-shake' : (phase === 'unlocking' || phase === 'unlocked') ? 'kabi-open' : '',
lockLabel: phase === 'failed' ? 'ロック解除に失敗' : (phase === 'unlocking' || phase === 'unlocked') ? 'ロック解除' : 'ロック中',
clearClass: phase === 'unlocked' ? 'kabi-clear' : '',
lockShown: phase === 'idle' ? '' : 'kabi-shown',
onChange: (e) => this.setState({ value: e.target.value }),
onKeyDown: (e) => {
if (e.key === 'Enter') {
e.preventDefault();
this.submit();
return;
}
if ((this.state.phase === 'idle' || this.state.phase === 'failed') && (e.key.length === 1 || e.key === 'Backspace')) {
this.spawnBar();
}
}
};
}
}
</script>
</body>
</html>
