<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>kabi-lock 入力の印の比較</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3a4252}a:hover{color:#141820}
.kabi-soft{position:absolute;top:0;width:32px;height:56px;background:linear-gradient(90deg,rgba(255,255,255,0.85) 0%,rgba(255,255,255,0.38) 22%,rgba(255,255,255,0.38) 78%,rgba(255,255,255,0.85) 100%);-webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 100%);mask-image:linear-gradient(to bottom,transparent 0%,#000 100%)}
.kabi-dot{position:absolute;top:24px;width:8px;height:8px;border-radius:50%;background:#ffffff;box-shadow:0 0 12px 3px rgba(255,255,255,0.45)}
.kabi-dash{position:absolute;bottom:0;width:28px;height:3px;border-radius:2px;background:#ffffff}
.kabi-ring{position:absolute;border:1.5px solid #ffffff;border-radius:50%;box-sizing:border-box}
</style>
</helmet>
<div style="width: 1920px; height: 560px; box-sizing: border-box; padding: 56px 64px; background: #f4f5f7; font-family: 'Inter', 'Noto Sans JP', sans-serif; color: #141820; display: flex; flex-direction: column; gap: 32px">
  <div style="display: flex; align-items: baseline; gap: 20px">
    <h1 style="margin: 0; font-size: 32px; font-weight: 700">入力の印：案の比較</h1>
    <p style="margin: 0; font-size: 18px; color: #4a5263">どれも打鍵ごとにランダムな位置に出て、フェードで消える。濃いものほど新しい</p>
  </div>
  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 40px">
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 14px">
      <div style="height: 300px; border-radius: 10px; background: #12151b; display: flex; align-items: center; justify-content: center">
        <div role="img" aria-label="案A：両端が明るく中が抜けた細めの帯。上下もぼかす" style="position: relative; width: 340px; height: 56px">
          <div class="kabi-soft" style="left: 30px; opacity: 0.25"></div>
          <div class="kabi-soft" style="left: 250px; opacity: 0.5"></div>
          <div class="kabi-soft" style="left: 120px; opacity: 1"></div>
        </div>
      </div>
      <figcaption style="font-size: 17px; color: #2b3240"><strong>A　光の柱（採用）</strong>　両端を少し強めた光の柱。下が濃く上へ抜け、ふわっと立ち上がって消える</figcaption>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 14px">
      <div style="height: 300px; border-radius: 10px; background: #12151b; display: flex; align-items: center; justify-content: center">
        <div role="img" aria-label="案B：小さな光の粒" style="position: relative; width: 340px; height: 56px">
          <div class="kabi-dot" style="left: 40px; opacity: 0.25"></div>
          <div class="kabi-dot" style="left: 268px; opacity: 0.5"></div>
          <div class="kabi-dot" style="left: 150px; opacity: 1"></div>
        </div>
      </div>
      <figcaption style="font-size: 17px; color: #2b3240"><strong>B　光の粒</strong>　小さな点がふわっと光って消える。一番控えめ</figcaption>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 14px">
      <div style="height: 300px; border-radius: 10px; background: #12151b; display: flex; align-items: center; justify-content: center">
        <div role="img" aria-label="案C：うっすらした基準線の上に出る短い下線" style="position: relative; width: 340px; height: 56px">
          <div style="position: absolute; left: 0; right: 0; bottom: 1px; height: 1px; background: rgba(255,255,255,0.16)"></div>
          <div class="kabi-dash" style="left: 36px; opacity: 0.25"></div>
          <div class="kabi-dash" style="left: 262px; opacity: 0.5"></div>
          <div class="kabi-dash" style="left: 146px; opacity: 1"></div>
        </div>
      </div>
      <figcaption style="font-size: 17px; color: #2b3240"><strong>C　下線</strong>　うっすらした線の上に短い下線が灯る。入力欄らしさが出る</figcaption>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 14px">
      <div style="height: 300px; border-radius: 10px; background: #12151b; display: flex; align-items: center; justify-content: center">
        <div role="img" aria-label="案D：広がりながら消える小さな波紋" style="position: relative; width: 340px; height: 56px">
          <div class="kabi-ring" style="left: 22px; top: 6px; width: 44px; height: 44px; opacity: 0.2"></div>
          <div class="kabi-ring" style="left: 252px; top: 13px; width: 30px; height: 30px; opacity: 0.45"></div>
          <div class="kabi-ring" style="left: 146px; top: 20px; width: 16px; height: 16px; opacity: 1"></div>
        </div>
      </div>
      <figcaption style="font-size: 17px; color: #2b3240"><strong>D　波紋</strong>　小さな輪が広がりながら消える。動きは一番目立つ</figcaption>
    </figure>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":560}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
