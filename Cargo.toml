[package]
name = "kabi-lock"
version = "0.1.0"
edition = "2024"
description = "A screen locker for sway (ext-session-lock) with a blurred, fading lock screen"
license = "BSD-3-Clause"
repository = "https://github.com/y1wtt/kabi-lock"

[dependencies]
chrono = { version = "0.4.45", features = ["unstable-locales"] }
egui = "0.37"
egui_glow = "0.37"
env_logger = "0.11.12"
fastrand = "2.5.0"
glow = "0.17"
khronos-egl = { version = "6.0.0", features = ["static"] }
log = "0.4.35"
nix = { version = "0.32.0", default-features = false, features = ["signal", "user"] }
pam-client = { version = "0.5.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_ignored = "0.1.14"
skrifa = "0.44"
smithay-client-toolkit = "0.21.1"
swayipc = "4.0.0"
toml = "1.2.2"
wayland-client = "0.31.15"
wayland-egl = "0.32.11"
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
zeroize = "1.9.2"
